appId: com.workstation.personal
productName: 个人工作站
copyright: Copyright © 2026 Personal Workstation

directories:
  buildResources: build
  output: release

# 本应用无原生模块（数据库使用 Electron 内置 node:sqlite），跳过依赖重建可显著加快打包
npmRebuild: false

files:
  - out/**/*
  - package.json
  # 托盘图标随包分发（主进程用 app.getAppPath() 读取）
  - build/tray.png
  - '!**/*.map'
  # 笔记导入用的 pdf.js 只保留 legacy 构建 + 中文字形映射 + 标准字体，其余目录不进安装包
  - '!**/node_modules/pdfjs-dist/{build,lib,web,types,image_decoders,examples,test,iccs,scripts,codegen,display,src}/**'
  - '!**/node_modules/pdfjs-dist/legacy/{image_decoders,core,display}/**'
  - '!**/node_modules/pdfjs-dist/legacy/build/{pdf.min.js,pdf.sandbox.js,pdf.sandbox.min.js,pdf.worker.min.js,pdf.worker.entry.js}'

# Playwright 需要以真实文件形式存在于磁盘上（asar 内无法定位驱动与浏览器）
asarUnpack:
  - '**/node_modules/playwright/**'
  - '**/node_modules/playwright-core/**'

win:
  # 应用图标：build/icon.ico 优先（16/24/32/48/64/128/256 全尺寸），build/icon.png 为 1024 透明底母版
  artifactName: PersonalWorkstation-Setup-${version}.${ext}
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 个人工作站
  deleteAppDataOnUninstall: false
